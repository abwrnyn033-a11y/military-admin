<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>واجهة الصراف</title>
  <style>
    :root{
      --bg:#f5f7fb;
      --card:#fff;
      --muted:#6b7280;
      --accent:#0f62fe;
      --danger:#b00020;
      --success:#16a34a;
      --glass: rgba(2,6,23,0.04);
    }
    html,body{height:100%}
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background:var(--bg);
      color:#111827;
      padding:20px;
      box-sizing:border-box;
    }
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    h1{margin:0;font-size:20px}
    .controls{display:flex;gap:8px;align-items:center}
    select, input[type="number"]{padding:8px;border:1px solid #e5e7eb;border-radius:6px}
    button{cursor:pointer;border:0;padding:8px 12px;border-radius:8px;background:var(--accent);color:#fff;font-weight:600}
    button.ghost{background:transparent;color:var(--accent);border:1px solid rgba(15,98,254,0.12)}
    .card{background:var(--card);padding:12px;border-radius:10px;box-shadow:0 6px 18px var(--glass)}
    table{width:100%;border-collapse:collapse;margin-top:12px}
    th,td{padding:10px 8px;text-align:right;border-bottom:1px solid #f1f5f9}
    th{background:transparent;color:var(--muted);font-weight:700}
    .actions{display:flex;gap:8px;justify-content:flex-end}
    .btn-pay{background:#059669;color:#fff;padding:6px 10px;border-radius:8px;border:0}
    .btn-disabled{opacity:0.45;cursor:not-allowed}
    #msg{margin-top:8px;font-size:14px}
    #msg.error{color:var(--danger)}
    #msg.success{color:var(--success)}
    .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (max-width:700px){ .controls{flex-direction:column;align-items:stretch} th,td{font-size:14px;padding:8px} }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>واجهة الصراف</h1>
      <div id="msg" aria-live="polite"></div>
    </div>

    <div class="controls" role="region" aria-label="عناصر التحكم">
      <label for="platoonSelect" style="font-size:13px;color:var(--muted);margin-right:6px">اختر الفصيلة</label>
      <select id="platoonSelect" aria-label="فصيلة">
        <!-- سوف يُملأ بالقيم افتراضياً -->
      </select>

      <label for="amountInput" style="font-size:13px;color:var(--muted);margin-right:6px">المبلغ</label>
      <input id="amountInput" type="number" min="0" step="0.01" value="50" style="width:100px" />

      <button id="loadBtn" class="ghost">تحميل</button>
      <button id="logoutBtn" class="ghost">تسجيل الخروج</button>
    </div>
  </header>

  <section class="card" aria-labelledby="listTitle">
    <h2 id="listTitle" style="margin:0 0 6px 0">أفراد الفصيلة</h2>

    <div style="overflow:auto">
      <table id="personsTable" role="table" aria-describedby="listTitle">
        <thead>
          <tr>
            <th scope="col">معرف</th>
            <th scope="col">الاسم</th>
            <th scope="col">الحالة</th>
            <th scope="col">إجراءات</th>
          </tr>
        </thead>
        <tbody id="personsBody">
          <tr><td colspan="4" style="text-align:center;padding:20px;color:var(--muted)">اختر فصيلة واضغط تحميل</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <script>
    (function () {
      const tokenKey = 'token';
      const platoonSelect = document.getElementById('platoonSelect');
      const loadBtn = document.getElementById('loadBtn');
      const logoutBtn = document.getElementById('logoutBtn');
      const amountInput = document.getElementById('amountInput');
      const personsBody = document.getElementById('personsBody');
      const msgEl = document.getElementById('msg');

      // Helper
      function getToken() {
        return localStorage.getItem(tokenKey);
      }

      function ensureAuthOrRedirect() {
        const t = getToken();
        if (!t) {
          window.location.href = '/';
          return false;
        }
        return true;
      }

      function showMessage(text, type) {
        msgEl.textContent = text || '';
        msgEl.className = type ? (type === 'error' ? 'error' : 'success') : '';
      }

      // Populate platoon select with a reasonable default list (1..20).
      // If you have an API for platoons, replace this initialization with a fetch.
      function populatePlatoons(max = 20) {
        platoonSelect.innerHTML = '';
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = 'اختر فصيلة...';
        platoonSelect.appendChild(placeholder);

        for (let i = 1; i <= max; i++) {
          const opt = document.createElement('option');
          opt.value = String(i);
          opt.textContent = 'فصيلة ' + i;
          platoonSelect.appendChild(opt);
        }
      }

      // Render table rows
      function renderPersons(list) {
        if (!Array.isArray(list) || list.length === 0) {
          personsBody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:18px;color:var(--muted)">لا توجد سجلات</td></tr>';
          return;
        }

        personsBody.innerHTML = '';
        list.forEach(p => {
          const tr = document.createElement('tr');

          const idTd = document.createElement('td');
          idTd.textContent = p.id ?? '';
          tr.appendChild(idTd);

          const nameTd = document.createElement('td');
          nameTd.textContent = p.name ?? '';
          tr.appendChild(nameTd);

          const statusTd = document.createElement('td');
          statusTd.textContent = p.status ?? '';
          tr.appendChild(statusTd);

          const actionsTd = document.createElement('td');
          actionsTd.className = 'actions';

          const payBtn = document.createElement('button');
          payBtn.className = 'btn-pay';
          payBtn.type = 'button';
          payBtn.textContent = 'صرف';
          // Enable only if status is حاضر
          const isPresent = String((p.status || '')).trim() === 'حاضر';
          if (!isPresent) {
            payBtn.disabled = true;
            payBtn.classList.add('btn-disabled');
            payBtn.title = 'مُعطّل: الحالة ليست "حاضر"';
          }

          payBtn.addEventListener('click', () => handlePay(p, payBtn));
          actionsTd.appendChild(payBtn);

          tr.appendChild(actionsTd);
          personsBody.appendChild(tr);
        });
      }

      // Fetch persons for selected platoon
      async function loadPersons() {
        if (!ensureAuthOrRedirect()) return;
        const platoon = platoonSelect.value;
        if (!platoon) {
          showMessage('اختر فصيلة أولاً', 'error');
          return;
        }
        showMessage('جارٍ تحميل الأفراد...', null);
        personsBody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:18px">جارٍ التحميل…</td></tr>';

        const token = getToken();
        try {
          const res = await fetch('/api/persons?platoon=' + encodeURIComponent(platoon), {
            method: 'GET',
            headers: {
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/json'
            }
          });

          if (res.status === 401 || res.status === 403) {
            localStorage.removeItem(tokenKey);
            window.location.href = '/';
            return;
          }

          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            showMessage(body?.message || 'فشل جلب الأفراد', 'error');
            personsBody.innerHTML = '';
            return;
          }

          const data = await res.json();
          renderPersons(data);
          showMessage('', null);
        } catch (err) {
          console.error('loadPersons error', err);
          showMessage('خطأ في الاتصال بالخادم.', 'error');
          personsBody.innerHTML = '';
        }
      }

      // Handle pay click
      async function handlePay(person, btn) {
        if (!ensureAuthOrRedirect()) return;
        const amountVal = Number(amountInput.value);
        if (!Number.isFinite(amountVal) || amountVal <= 0) {
          showMessage('أدخل مبلغ صالح (> 0).', 'error');
          return;
        }

        // confirm quick
        if (!confirm(`تأكيد صرف ${amountVal} للفرد ${person.name || person.id}?`)) return;

        btn.disabled = true;
        btn.innerHTML = 'جارٍ الصرف <span class="spinner" aria-hidden="true"></span>';

        const token = getToken();
        try {
          const res = await fetch('/api/finance/voucher', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/json'
            },
            body: JSON.stringify({
              person_id: person.id,
              amount: amountVal
            })
          });

          if (res.status === 401 || res.status === 403) {
            localStorage.removeItem(tokenKey);
            window.location.href = '/';
            return;
          }

          const body = await res.json().catch(() => ({}));

          if (!res.ok) {
            if (res.status === 409) {
              showMessage('تم تسجيل قسيمة لهذا الفرد اليوم سابقاً.', 'error');
            } else {
              showMessage(body?.message || ('فشل تسجيل الصرف (' + res.status + ')'), 'error');
            }
            // restore button state depending on current status
            const isPresent = String((person.status || '')).trim() === 'حاضر';
            btn.disabled = !isPresent;
            btn.classList.toggle('btn-disabled', !isPresent);
            btn.innerHTML = 'صرف';
            return;
          }

          // success
          showMessage('تم تسجيل الصرف.', 'success');
          // disable button after successful voucher to prevent duplicates
          btn.disabled = true;
          btn.classList.add('btn-disabled');
          btn.textContent = 'تم الصرف';
        } catch (err) {
          console.error('voucher error', err);
          showMessage('خطأ في الاتصال بالخادم.', 'error');
          btn.disabled = false;
          btn.classList.remove('btn-disabled');
          btn.textContent = 'صرف';
        }
      }

      // events
      loadBtn.addEventListener('click', () => loadPersons());
      logoutBtn.addEventListener('click', () => {
        localStorage.removeItem(tokenKey);
        window.location.href = '/';
      });

      // init
      populatePlatoons(30); // افتراضيًا 1..30؛ عدّل إن أردت
      // If token contains platoon info for cashier, optionally select it.
      (function tryPrefillFromToken() {
        const raw = getToken();
        if (!raw) return;
        try {
          // decode JWT payload (naive decode, no verification) to extract platoon if present
          const parts = raw.split('.');
          if (parts.length >= 2) {
            const payload = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
            if (payload && (payload.platoon || payload.platoon_id)) {
              const v = payload.platoon || payload.platoon_id;
              const opt = Array.from(platoonSelect.options).find(o => o.value === String(v));
              if (opt) platoonSelect.value = String(v);
            }
          }
        } catch (e) {
          // ignore
        }
      })();

    })();
  </script>
</body>
</html>
