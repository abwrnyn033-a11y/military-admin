<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الأفراد - النظام العسكري</title>
<style>
body{font-family:system-ui;background:#f5f7fb;margin:0;padding:15px}
.nav{background:#fff;padding:10px;border-radius:12px;display:flex;gap:8px;margin-bottom:15px;box-shadow:0 2px 8px #0001}
.nav a{padding:8px 14px;border-radius:8px;text-decoration:none;color:#333;background:#eef2ff}
.nav a.active{background:#2563eb;color:#fff}
.card{background:#fff;padding:15px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 8px #0001}
input,select,button{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #ddd;box-sizing:border-box}
button{background:#2563eb;color:#fff;border:none;font-weight:bold;cursor:pointer}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #eee;text-align:right;font-size:14px}
</style>
</head>
<body>
<div class="nav">
<a href="/dashboard.html">لوحة القائد</a>
<a href="/persons.html" class="active">الأفراد</a>
<a href="/finance.html">المالية</a>
<a href="/" onclick="localStorage.clear()">خروج</a>
</div>

<div class="card">
<h3>إضافة فرد جديد</h3>
<input id="name" placeholder="الاسم الكامل">
<input id="militaryId" placeholder="الرقم العسكري">
<input id="rank" placeholder="الرتبة - مثال: جندي">
<input id="unit" placeholder="الوحدة">
<button onclick="addPerson()">إضافة</button>
</div>

<div class="card">
<h3>قائمة الأفراد <span id="count"></span></h3>
<table>
<thead><tr><th>الاسم</th><th>الرقم</th><th>الرتبة</th><th>إجراء</th></tr></thead>
<tbody id="list"><tr><td colspan="4">جاري التحميل...</td></tr></tbody>
</table>
</div>

<script>
const token = localStorage.getItem('token') || localStorage.getItem('jwt') || localStorage.getItem('authToken');
if(!token) location.href='/';
const headers = {'Content-Type':'application/json','Authorization':'Bearer '+token};

async function load(){
try{
const res = await fetch('/api/persons',{headers});
const data = await res.json();
const persons = data.persons || data.data || data || [];
document.getElementById('count').innerText='('+persons.length+')';
document.getElementById('list').innerHTML = persons.length? persons.map(p=>`
<tr><td>${p.name||''}</td><td>${p.militaryId||p.military_number||''}</td><td>${p.rank||''}</td>
<td><button onclick="delPerson('${p._id||p.id}')" style="background:#ef4444;padding:5px">حذف</button></td></tr>
`).join('') : '<tr><td colspan="4">لا يوجد أفراد - أضف أول فرد</td></tr>';
}catch(e){document.getElementById('list').innerHTML='<tr><td colspan="4">خطأ: '+e.message+'</td></tr>'}
}

async function addPerson(){
const body={name:document.getElementById('name').value, militaryId:document.getElementById('militaryId').value, rank:document.getElementById('rank').value, unit:document.getElementById('unit').value};
if(!body.name) return alert('اكتب الاسم');
const res=await fetch('/api/persons',{method:'POST',headers,body:JSON.stringify(body)});
if(res.ok){document.getElementById('name').value='';document.getElementById('militaryId').value='';load();}else{const err=await res.text();alert('خطأ: '+err)}
}

async function delPerson(id){
if(!confirm('حذف؟')) return;
await fetch('/api/persons/'+id,{method:'DELETE',headers});
load();
}
load();
</script>
</body>
</html>
